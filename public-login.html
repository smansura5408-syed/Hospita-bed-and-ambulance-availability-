<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public Login - MediBoard</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    font-family:Arial, sans-serif;
    background:#f2f6fc;
}

.container{
    width:380px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#007bff;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

p{
    text-align:center;
}

a{
    text-decoration:none;
    color:#007bff;
}
</style>

</head>
<body>

<div class="container">

<h2>🏥 Public Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="publicLogin()">
Login
</button>

<p id="msg"></p>

<br>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

<p>
<a href="index.html">← Home</a>
</p>

</div>

<script src="js/api.js"></script>

<script>

async function publicLogin(){

    const username=document.getElementById("username").value;
    const password=document.getElementById("password").value;

    try{

        const result = await apiRequest(
            "/auth/login",
            {
                method:"POST",

                body:JSON.stringify({

                    username:username,
                    password:password

                })
            }
        );


        if(result.role!=="PUBLIC"){

            document.getElementById("msg").innerHTML =
            "Please login using a Public account.";

            return;

        }


        localStorage.setItem(
            "publicUser",
            JSON.stringify(result)
        );


        document.getElementById("msg").innerHTML =
        "Login Successful";


        setTimeout(function(){

            window.location.href="public-dashboard.html";

        },1000);


    }
    catch(e){

        document.getElementById("msg").innerHTML =
        e.message;

    }

}

</script>

</body>
</html>
